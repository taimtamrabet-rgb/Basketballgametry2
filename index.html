/* ---------------- Result screens ---------------- */
function renderResultScreen() {
  const log = ui.lastLog;
  if (ui.lastLogKind === "hs") return renderHSResult(log);
  if (ui.lastLogKind === "college") return renderCollegeResult(log);
  if (ui.lastLogKind === "pro") return renderProResult(log);
  return "<div class='screen'>...</div>";
}

function gameResultBlock(result, oppLabelPrefix) {
  if (!result) return "";
  const outcome = result.win ? "WIN" : "LOSS";
  const flags = boxscoreFlags(result.boxscore);
  const badges = [];
  if (flags.tripleDouble) badges.push("Triple-Double!");
  else if (flags.doubleDouble) badges.push("Double-Double");
  if (result.buzzerBeater) badges.push("Buzzer Beater!");
  if (result.injury) badges.push("Minor injury — needs to manage energy better");
  return `<div class="game-result ${result.win ? "win" : "loss"}">
    <h3>${outcome} — ${result.yourScore} to ${result.oppScore}</h3>
    ${boxscoreTable(result.boxscore)}
    ${badges.length ? `<div class="badge-row">${badges.map(b => `<span class="badge">${escapeHtml(b)}</span>`).join("")}</div>` : ""}
  </div>`;
}

function renderHSResult(log) {
  const player = STATE.player;
  let body = "";
  body += log.training.length ? `<div class="training-log">${log.training.map(t => `<p>${escapeHtml(t.name)}: ${escapeHtml(t.detail)}</p>`).join("")}</div>` : "";
  body += narrativeBlockReadOnly(log.narrative);

  if (log.game) {
    if (log.game.isBye) body += `<div class="game-preview bye">${escapeHtml(log.game.reason)}</div>`;
    else body += gameResultBlock(log.game.result);
  }
  body += unlockedBlock(log);

  let banquetBlock = "";
  let continueLabel = "Continue";
  if (log.banquet) {
    const b = log.banquet;
    banquetBlock = `<div class="banquet-block"><h3>${HS_YEAR_LABELS[b.year]} Year Recap</h3>
      <p>Final record: ${b.wins}-${b.losses}</p>
      <ul>${b.goalsEvaluated.map(g => `<li class="${g.done ? "goal-done" : "goal-missed"}">${g.done ? "✔" : "✘"} ${escapeHtml(g.name)} — ${escapeHtml(g.desc)}</li>`).join("")}</ul>
      </div>`;
    if (player.stage === "recruiting") continueLabel = "Continue to Recruiting";
    else continueLabel = `Continue to ${HS_YEAR_LABELS[player.hsYear]} Year`;
  }

  return `<div class="screen">
    <h2>${log.banquet ? "Season Complete" : `Week Recap`}</h2>
    ${body}${banquetBlock}
    <button class="primary-btn" data-action="hs-continue">${continueLabel}</button>
  </div>`;
}

function renderCollegeResult(log) {
  const player = STATE.player;
  let body = "";
  body += log.training && log.training.length ? `<div class="training-log">${log.training.map(t => `<p>${escapeHtml(t.name)}: ${escapeHtml(t.detail)}</p>`).join("")}</div>` : "";
  body += narrativeBlockReadOnly(log.narrative);
  if (log.trade) body += `<div class="narrative-box"><p>${escapeHtml(log.trade)}</p></div>`;

  if (log.game) {
    if (log.game.skipped) body += `<div class="game-preview bye">${escapeHtml(log.game.reason)}</div>`;
    else if (log.game.block) {
      body += `<div class="game-result"><h3>Conference Slate: ${log.game.block.wins}-${log.game.block.losses}</h3>${boxscoreTable(log.game.block.avgBox)}<p class="pos-detail">(season averages per game)</p></div>`;
    } else if (log.game.result) {
      body += `<h4>${escapeHtml(log.game.label)}</h4>${gameResultBlock(log.game.result)}`;
    }
  }
  body += unlockedBlock(log);

  let banquetBlock = "";
  let footer = `<button class="primary-btn" data-action="college-continue">Continue</button>`;
  if (log.banquet) {
    const b = log.banquet;
    banquetBlock = `<div class="banquet-block"><h3>Season ${b.year} Recap</h3>
      <p>Record: ${b.wins}-${b.losses}</p>
      <p>${b.wonNational ? "National Champions!" : b.wonConfTourney ? "Conference Tournament Champions" : "Season complete."}</p>
      ${b.poy ? `<p>Conference Player of the Year!</p>` : ""}
      <p>Draft stock: <strong>${b.draftStock}</strong></p>
      ${stockStarBlock(b.draftStock, "prospect")}</div>`;
    if (b.mustDeclare) {
      footer = `<div class="choice-column"><p>Out of college eligibility — must declare for the draft.</p>
        <button class="primary-btn" data-action="college-declare">Declare for the Draft</button></div>`;
    } else {
      footer = `<div class="choice-column">
        <button class="primary-btn" data-action="college-return">Return for Another Season</button>
        <button class="secondary-btn" data-action="college-declare">Declare for the Draft</button></div>`;
    }
  }

  return `<div class="screen"><h2>${log.banquet ? "Season Complete" : "Step Recap"}</h2>${body}${banquetBlock}${footer}</div>`;
}

function renderProResult(log) {
  const player = STATE.player;
  let body = "";
  body += log.training && log.training.length ? `<div class="training-log">${log.training.map(t => `<p>${escapeHtml(t.name)}: ${escapeHtml(t.detail)}</p>`).join("")}</div>` : "";
  body += narrativeBlockReadOnly(log.narrative);
  if (log.trade) body += `<div class="narrative-box"><p>${escapeHtml(log.trade)}</p></div>`;

  if (log.allStar) {
    body += log.allStar.selected ? `<div class="game-result win"><h3>All-Star Selection!</h3></div>` : `<div class="game-preview">No All-Star nod this year.</div>`;
  }

  if (log.game) {
    if (log.game.skipped) body += `<div class="game-preview bye">${escapeHtml(log.game.reason)}</div>`;
    else if (log.game.block) {
      body += `<div class="game-result"><h3>Regular Season: ${log.game.block.wins}-${log.game.block.losses}</h3>${boxscoreTable(log.game.block.avgBox)}<p class="pos-detail">(season averages per game)</p></div>`;
    } else if (log.game.result) {
      body += `<h4>${escapeHtml(log.game.label)}</h4>${gameResultBlock(log.game.result)}`;
    }
  }
  body += unlockedBlock(log);

  let banquetBlock = "";
  let footer = `<button class="primary-btn" data-action="pro-continue">Continue</button>`;
  if (log.banquet) {
    const b = log.banquet;
    banquetBlock = `<div class="banquet-block"><h3>Pro Season ${b.year} Recap (Age ${b.age})</h3>
      <p>Record: ${b.wins}-${b.losses}</p>
      <p>${b.wonChampionship ? "League Champions!" : b.reachedFinals ? "Reached the League Finals" : b.madePlayoffs ? "Made the Playoffs" : "Missed the playoffs."}</p>
      ${b.allStar ? "<p>All-Star selection.</p>" : ""}</div>`;
    if (b.forceRetire) {
      banquetBlock += `<div class="narrative-box"><p>${escapeHtml(player.name)} ${escapeHtml(player.retirementReason)}.</p></div>`;
      footer = `<button class="primary-btn" data-action="pro-continue">See Career Summary</button>`;
    } else {
      footer = `<div class="choice-column">
        <button class="primary-btn" data-action="pro-continue-career">Play Another Season</button>
        <button class="secondary-btn" data-action="pro-retire">Retire</button></div>`;
    }
  }

  return `<div class="screen"><h2>${log.banquet ? "Season Complete" : "Step Recap"}</h2>${body}${banquetBlock}${footer}</div>`;
}

/* ---------------- Retirement / career summary ---------------- */
function renderRetirement() {
  const s = computeCareerSummary(STATE);
  const player = STATE.player;

  const statLines = [];
  if (s.hsLine.games > 0) statLines.push(`<tr><td>High School</td><td>${s.hsLine.games}</td><td>${s.hsLine.ppg}</td><td>${s.hsLine.rpg}</td><td>${s.hsLine.apg}</td></tr>`);
  if (s.collegeLine.games > 0) statLines.push(`<tr><td>College</td><td>${s.collegeLine.games}</td><td>${s.collegeLine.ppg}</td><td>${s.collegeLine.rpg}</td><td>${s.collegeLine.apg}</td></tr>`);
  if (s.proLine.games > 0) statLines.push(`<tr><td>Pro</td><td>${s.proLine.games}</td><td>${s.proLine.ppg}</td><td>${s.proLine.rpg}</td><td>${s.proLine.apg}</td></tr>`);

  return `<div class="screen retirement-screen">
    <h1>${s.isHOF ? "🏆 " : ""}${escapeHtml(player.name)}: ${escapeHtml(s.grade)}</h1>
    ${s.epilogue.map(p => `<p>${escapeHtml(p)}</p>`).join("")}
    <table class="career-table"><thead><tr><th>Level</th><th>GP</th><th>PPG</th><th>RPG</th><th>APG</th></tr></thead>
    <tbody>${statLines.join("")}</tbody></table>
    <h3>Awards (${s.awards.length})</h3>
    <ul class="award-list">${s.awards.map(a => `<li>${a.stage.toUpperCase()} Yr${a.year}: ${escapeHtml(a.award)}</li>`).join("") || "<li>None</li>"}</ul>
    <h3>Achievements (${s.achievements.length})</h3>
    <ul class="award-list">${s.achievements.map(id => `<li>${escapeHtml(achName(id))}</li>`).join("") || "<li>None</li>"}</ul>
    <button class="primary-btn" data-action="restart-career">Start a New Career</button>
  </div>`;
}

/* ---------------- Event delegation ---------------- */
function onAppClick(e) {
  const btn = e.target.closest("[data-action]");
  if (!btn || btn.disabled) return;
  const action = btn.dataset.action;

  /* Any click while on the creation screen re-renders from ui.creation, which would
     silently discard whatever's currently typed in the name/team inputs unless we
     pull their live values in first. */
  if (!STATE) syncCreationInputs();

  switch (action) {
    case "create-select-position":
      ui.creation.position = btn.dataset.pos;
      render();
      break;
    case "create-select-star-tier": {
      const stars = parseInt(btn.dataset.stars, 10);
      const tier = CREATION_STAR_TIERS.find(t => t.stars === stars);
      if (!tier || ui.creation.starTier === stars) break;
      ui.creation.starTier = stars;
      ui.creation.pool = tier.pool;
      ui.creation.stats = newStatBlock();
      render();
      break;
    }
    case "create-stat-delta": {
      const stat = btn.dataset.stat, delta = parseInt(btn.dataset.delta, 10);
      const c = ui.creation;
      const cur = c.stats[stat];
      if (delta > 0 && cur < STAT_MAX_START && c.pool > 0) { c.stats[stat] = cur + 1; c.pool -= 1; }
      if (delta < 0 && cur > STAT_BASE_START) { c.stats[stat] = cur - 1; c.pool += 1; }
      render();
      break;
    }
    case "create-start": {
      syncCreationInputs();
      const c = ui.creation;
      if (!c.position || c.pool !== 0) return;
      const name = c.name.trim() || "Alex Carter";
      const teamName = c.teamName.trim() || DEFAULT_TEAM_NAME;
      STATE = newCareerState(name, teamName, c.position, { ...c.stats });
      saveState();
      render();
      break;
    }
    case "toggle-session": {
      const id = btn.dataset.session;
      const idx = ui.selectedSessions.indexOf(id);
      if (idx >= 0) ui.selectedSessions.splice(idx, 1);
      else if (ui.selectedSessions.length < 2) ui.selectedSessions.push(id);
      render();
      break;
    }
    case "select-narrative-choice":
      ui.narrativeChoiceIdx = parseInt(btn.dataset.choice, 10);
      render();
      break;
    case "hs-advance": {
      const log = advanceHSWeek(STATE, ui.selectedSessions, ui.narrativeChoiceIdx);
      saveState();
      ui.lastLog = log; ui.lastLogKind = "hs"; ui.showingResult = true;
      render();
      break;
    }
    case "hs-continue":
      ui.showingResult = false; ui.lastLog = null;
      render();
      break;
    case "recruit-choose": {
      const idx = parseInt(btn.dataset.offerIdx, 10);
      const offer = STATE._offers[idx];
      chooseCollegeOffer(STATE, offer);
      STATE._offers = null;
      saveState();
      render();
      break;
    }
    case "college-advance": {
      const log = advanceCollegeStep(STATE, ui.selectedSessions, ui.narrativeChoiceIdx);
      saveState();
      ui.lastLog = log; ui.lastLogKind = "college"; ui.showingResult = true;
      render();
      break;
    }
    case "college-continue":
      ui.showingResult = false; ui.lastLog = null;
      render();
      break;
    case "college-declare":
      declareForDraft(STATE);
      ui.lastDraftResult = null;
      saveState();
      ui.showingResult = false; ui.lastLog = null;
      render();
      break;
    case "college-return":
      returnToCollege(STATE);
      saveState();
      ui.showingResult = false; ui.lastLog = null;
      render();
      break;
    case "draft-attempt": {
      const result = runDraftNight(STATE);
      ui.lastDraftResult = result;
      saveState();
      render();
      break;
    }
    case "draft-accept":
      beginProCareer(STATE, ui.lastDraftResult.team);
      ui.lastDraftResult = null;
      saveState();
      render();
      break;
    case "draft-sign-ufa":
      signUndraftedFreeAgent(STATE);
      ui.lastDraftResult = null;
      saveState();
      render();
      break;
    case "draft-go-overseas":
      goOverseas(STATE);
      ui.lastDraftResult = null;
      saveState();
      render();
      break;
    case "draft-retire":
      retireBeforeProCareer(STATE);
      ui.lastDraftResult = null;
      saveState();
      render();
      break;
    case "pro-advance": {
      const log = advanceProStep(STATE, ui.selectedSessions, ui.narrativeChoiceIdx);
      saveState();
      ui.lastLog = log; ui.lastLogKind = "pro"; ui.showingResult = true;
      render();
      break;
    }
    case "pro-continue":
      ui.showingResult = false; ui.lastLog = null;
      saveState();
      render();
      break;
    case "pro-continue-career":
      continueProCareer(STATE);
      saveState();
      ui.showingResult = false; ui.lastLog = null;
      render();
      break;
    case "pro-retire":
      retireVoluntarily(STATE);
      saveState();
      ui.showingResult = false; ui.lastLog = null;
      render();
      break;
    case "restart-career":
      if (confirm("Start a brand new career? This will erase the current one.")) {
        STATE = null;
        localStorage.removeItem(SAVE_KEY);
        ui.showingResult = false; ui.lastLog = null; ui.lastDraftResult = null;
        resetCreationUI();
        render();
      }
      break;
  }
}

document.addEventListener("DOMContentLoaded", init);

</script>
